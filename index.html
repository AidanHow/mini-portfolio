<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aidan Howe - Portfolio</title>
    <style>
        body { background-color: #0b0b0b; color: #ffffff; font-family: sans-serif; margin: 40px; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .grid-item { background: #161616; border-radius: 8px; overflow: hidden; text-align: center; }
        .grid-item img { width: 100%; height: 250px; object-fit: cover; display: block; }
        .grid-item .label { padding: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <h1 style="text-align:center;">PORTFOLIO GRID</h1>
    <div class="portfolio-grid">    </div>
</body>
</html>
